name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: src/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest ../../tests/ -v --tb=short
        env:
          PYTHONPATH: .

      - name: Validate system-model.yaml
        run: |
          python -c "
          from services import ArchitectureService
          service = ArchitectureService('../../docs/architecture/system-model.yaml')
          result = service.validate_model()
          if not result['valid']:
              print('Validation failed:')
              for issue in result['issues']:
                  print(f'  - {issue}')
              exit(1)
          print(f'Model valid: {result[\"node_count\"]} nodes, {result[\"edge_count\"]} edges')
          # Also test Mermaid generation
          diagram = service.generate_mermaid()
          if 'flowchart' not in diagram:
              print('Mermaid diagram generation failed')
              exit(1)
          print('Mermaid diagram generated successfully')
          "
        env:
          PYTHONPATH: .

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
